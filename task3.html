<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reserve a table – Café</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Montserrat', sans-serif;
      background: #f8f9fa;
      padding: 2rem 1rem;
    }
    .card {
      max-width: 520px;
      margin: 0 auto;
      border: none;
      border-radius: 1rem;
      box-shadow: 0 6px 24px rgba(0,0,0,0.08);
    }
    .card-header {
      background: #0F6B5F;
      color: white;
      font-weight: 600;
      border-radius: 1rem 1rem 0 0 !important;
    }
    .form-label {
      font-weight: 500;
    }
    .btn-primary {
      background-color: #0F6B5F;
      border-color: #0F6B5F;
    }
    .btn-primary:hover {
      background-color: #0c5a50;
      border-color: #0c5a50;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="card-header py-3">
      Reserve a table
    </div>
    <div class="card-body p-4">
      <form>
        
        <div class="mb-3">
          <label for="name" class="form-label">Your name</label>
          <input type="text" class="form-control" id="name" name="name" required
                 autocomplete="name" placeholder="John Doe">
        </div>

        
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input type="email" class="form-control" id="email" name="email" required
                 autocomplete="email" placeholder="name@example.com">
        </div>

        
        <div class="mb-3">
          <label for="phone" class="form-label">Phone</label>
          <input type="tel" class="form-control" id="phone" name="phone" required
                 autocomplete="tel" placeholder="+7 701 234 56 78">
        </div>

        
        <div class="mb-3">
          <label for="guests" class="form-label">Guests</label>
          <input type="number" class="form-control" id="guests" name="guests"
                 min="1" max="20" value="2" required>
        </div>

        
        <div class="mb-3">
          <label for="date" class="form-label">Date</label>
          <input type="date" class="form-control" id="date" name="date" required>
        </div>

        
        <fieldset class="mb-3">
          <legend class="form-label fs-6">Seating</legend>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="seating" id="inside" value="inside" checked>
            <label class="form-check-label" for="inside">Inside</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="seating" id="terrace" value="terrace">
            <label class="form-check-label" for="terrace">Terrace</label>
          </div>
        </fieldset>

        
        <div class="mb-3">
          <label for="meal" class="form-label">Meal</label>
          <select class="form-select" id="meal" name="meal" required>
            <option value="" disabled selected>Choose…</option>
            <option value="lunch">Lunch</option>
            <option value="dinner">Dinner</option>
          </select>
        </div>

        
        <div class="mb-3">
          <label for="comments" class="form-label">Comments</label>
          <textarea class="form-control" id="comments" name="comments" rows="3"
                    placeholder="Any special requests?"></textarea>
        </div>

        
        <div class="mb-4">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="terms" name="terms" required>
            <label class="form-check-label" for="terms">
              I agree to the terms
            </label>
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-100">Reserve</button>
      </form>
    </div>
  </div>
</body>
</html>
