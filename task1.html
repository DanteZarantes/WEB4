<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book a train ticket</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #0F6B5F;
      --accent: #F2A93B;
      --dark: #16302B;
      --light-bg: #F4F7F5;
      --soft: #E6EFEC;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background-color: #f0f2f5;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 1.5rem 1rem;
    }

    .ticket-card {
      background: white;
      border-radius: 1rem;
      box-shadow: 0 8px 30px rgba(22, 48, 43, 0.12);
      overflow: hidden;
      max-width: 720px;
      width: 100%;
    }

    .ticket-header {
      background-color: var(--primary);
      color: white;
      padding: 1.25rem 1.5rem;
      font-weight: 600;
      font-size: 1.25rem;
    }

    .ticket-body {
      padding: 1.5rem;
      background-color: var(--light-bg);
    }

    
    .trip-type {
      display: inline-flex;
      background: white;
      border-radius: 2rem;
      padding: 0.25rem;
      border: 1px solid var(--soft);
      margin-bottom: 1.25rem;
    }

    .trip-type .btn-check + .btn {
      border-radius: 2rem;
      padding: 0.4rem 1.25rem;
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--dark);
      border: none;
      background: transparent;
    }

    .trip-type .btn-check:checked + .btn {
      background-color: var(--primary);
      color: white;
    }

    .form-control,
    .form-select {
      border-radius: 0.5rem;
      border: 1px solid #d0d7d4;
      padding: 0.6rem 0.9rem;
      font-size: 0.95rem;
      background-color: white;
    }

    .form-control:focus,
    .form-select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 0.2rem rgba(15, 107, 95, 0.2);
    }

    .form-label {
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--dark);
      margin-bottom: 0.3rem;
    }

    .phone-group .input-group-text {
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 0.5rem 0 0 0.5rem;
      font-weight: 500;
    }

    .phone-group .form-control {
      border-radius: 0 0.5rem 0.5rem 0;
    }

    .form-check-input:checked {
      background-color: var(--primary);
      border-color: var(--primary);
    }

    .form-check-input:focus {
      box-shadow: 0 0 0 0.2rem rgba(15, 107, 95, 0.25);
    }

    .form-check-input[type="checkbox"]:checked {
      background-color: var(--primary);
      border-color: var(--primary);
    }

    .btn-find {
      background-color: var(--accent);
      border: none;
      color: var(--dark);
      font-weight: 600;
      border-radius: 2rem;
      padding: 0.55rem 1.75rem;
    }

    .btn-find:hover {
      background-color: #e09a2e;
      color: var(--dark);
    }

    .btn-clear {
      background: white;
      border: 1px solid #c5cec9;
      color: var(--dark);
      font-weight: 500;
      border-radius: 2rem;
      padding: 0.55rem 1.5rem;
    }

    .btn-clear:hover {
      background: var(--soft);
      border-color: #b0bbb5;
    }

    @media (max-width: 575.98px) {
      .ticket-body {
        padding: 1rem;
      }

      .btn-find,
      .btn-clear {
        width: 100%;
      }

      .btn-find {
        order: 1;
      }

      .btn-clear {
        order: 2;
      }

      .trip-type {
        width: 100%;
        justify-content: center;
      }
    }

    #oneway:checked ~ .form-row .return-field {
      opacity: 0.5;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="ticket-card">
    <div class="ticket-header">
      Book a train ticket
    </div>
    <div class="ticket-body">
      <form id="ticketForm">
        
        <div class="trip-type">
          <input type="radio" class="btn-check" name="tripType" id="oneway" value="oneway" checked required>
          <label class="btn" for="oneway">One way</label>

          <input type="radio" class="btn-check" name="tripType" id="roundtrip" value="roundtrip">
          <label class="btn" for="roundtrip">Round trip</label>
        </div>

        
        <div class="row g-3 mb-3">
          <div class="col-6 col-md-6">
            <label for="from" class="form-label">From</label>
            <input type="text" class="form-control" id="from" name="from" value="Astana" required>
          </div>
          <div class="col-6 col-md-6">
            <label for="to" class="form-label">To</label>
            <input type="text" class="form-control" id="to" name="to" value="Almaty" required>
          </div>
        </div>

        
        <div class="row g-3 mb-3">
          <div class="col-6 col-md-4">
            <label for="departure" class="form-label">Departure</label>
            <input type="date" class="form-control" id="departure" name="departure" required>
          </div>
          <div class="col-6 col-md-4 return-field">
            <label for="return" class="form-label">Return</label>
            <input type="date" class="form-control" id="return" name="return">
          </div>
          <div class="col-12 col-md-4">
            <label for="passengers" class="form-label">Passengers</label>
            <select class="form-select" id="passengers" name="passengers" required>
              <option value="1" selected>1 adult</option>
              <option value="2">2 adults</option>
              <option value="3">3 adults</option>
              <option value="4">4 adults</option>
              <option value="5">5 adults</option>
              <option value="6">6 adults</option>
            </select>
          </div>
        </div>

        
        <div class="mb-3">
          <label class="form-label d-block">Carriage class</label>
          <div class="d-flex gap-3 flex-wrap">
            <div class="form-check">
              <input class="form-check-input" type="radio" name="carriage" id="seat" value="seat" required>
              <label class="form-check-label" for="seat">Seat</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="carriage" id="coupe" value="coupe" checked required>
              <label class="form-check-label" for="coupe">Coupé</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="carriage" id="sleeper" value="sleeper" required>
              <label class="form-check-label" for="sleeper">Sleeper</label>
            </div>
          </div>
        </div>

        
        <div class="row g-3 mb-3">
          <div class="col-12 col-md-6">
            <label for="phone" class="form-label">Phone</label>
            <div class="input-group phone-group">
              <span class="input-group-text">+7</span>
              <input type="tel" class="form-control" id="phone" name="phone"
                     pattern="[0-9]{10}" placeholder="701 234 56 78"
                     title="Enter 10 digits" required>
            </div>
          </div>
          <div class="col-12 col-md-6">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" name="email"
                   placeholder="name@example.com" required>
          </div>
        </div>

        
        <div class="mb-4">
          <div class="form-check mb-2">
            <input class="form-check-input" type="checkbox" id="sms" name="sms">
            <label class="form-check-label" for="sms">Also send the ticket by SMS</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="rules" name="rules" required>
            <label class="form-check-label" for="rules">I agree with the carriage rules</label>
          </div>
        </div>

        
        <div class="d-flex flex-column flex-sm-row gap-2 justify-content-end">
          <button type="reset" class="btn btn-clear">Clear</button>
          <button type="submit" class="btn btn-find">Find trains</button>
        </div>
      </form>
    </div>
  </div>

  
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
